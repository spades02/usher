version: 2
updates:
  # Pinned action SHAs get bumped here, with the version in the trailing comment.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # New releases wait two weeks before they're proposed (supply-chain cooling-off).
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
    # The MCP SDK and zod are part of Usher's contract: update them deliberately, one at a time.
    ignore:
      - dependency-name: "@modelcontextprotocol/*"
        update-types: ["version-update:semver-major"]
