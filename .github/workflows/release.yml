name: Release

# On main, Changesets either opens/updates a "Version packages" pull request
# (bumping versions and writing CHANGELOG.md from the pending changesets) or,
# once that PR is merged, publishes to npm with provenance (ADR 0010).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and tags
      pull-requests: write # the "Version packages" PR
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Trusted publishing (OIDC, no npm token) needs npm >= 11.5.1. pnpm hands
      # `publish` to this npm, so fail early and clearly if it's too old.
      - name: Check npm supports trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' is too old for trusted publishing'); process.exit(1) }" "$(npm --version)"
      - run: pnpm --filter @usherjs/core build
      - run: pnpm test
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          title: Version packages
          commit: "chore: version packages"
          version: pnpm changeset version
          # Rebuilds and re-checks the exact files that get published.
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: npm authenticates this workflow through trusted
          # publishing (OIDC, `id-token: write` above) and adds provenance.
          NPM_CONFIG_PROVENANCE: "true"
